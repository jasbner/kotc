<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOTC Leaderboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14171c; --muted: #6b7280; --line: #e5e7eb;
    --gold: #b7791f; --gold-bg: #fdf6e3; --live: #dc2626; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --card: #161b22; --text: #e6e8eb; --muted: #8b949e; --line: #2a313c;
            --gold: #e3b341; --gold-bg: #2a2410; --live: #f85149; --accent: #58a6ff; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .controls label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  input[type=date], button { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--card); color: var(--text); }
  button { cursor: pointer; }
  .king { background: var(--gold-bg); border: 1px solid var(--gold); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 16px; font-size: 1.1rem; }
  .king b { color: var(--gold); }
  .games { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
  .game { flex: 0 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 8px 10px; font-size: .8rem; min-width: 118px; }
  .game .row { display: flex; justify-content: space-between; gap: 10px; }
  .game .st { color: var(--muted); margin-top: 3px; }
  .game.in .st { color: var(--live); font-weight: 600; }
  .wrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       position: sticky; top: 0; background: var(--card); }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  td.rank { color: var(--muted); width: 1%; }
  td.pra { font-weight: 700; }
  td.status { color: var(--muted); font-size: .8rem; }
  td.status.in { color: var(--live); font-weight: 600; }
  tr.top td { background: var(--gold-bg); }
  tr.top td.pra { color: var(--gold); }
  .team { display: inline-flex; align-items: center; gap: 6px; }
  .team img { width: 20px; height: 20px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live);
         margin-right: 5px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
         color: var(--muted); padding: 8px 12px; margin-bottom: -1px; }
  .tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--gold); font-weight: 600; }
  button.game { font: inherit; font-size: .8rem; text-align: left; cursor: pointer; }
  .game.out { opacity: .4; text-decoration: line-through; }
  .tag { font-size: .7rem; font-weight: 600; color: var(--accent); border: 1px solid currentColor;
         border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .foot { color: var(--muted); font-size: .8rem; margin-top: 12px; }
  @media (max-width: 560px) { .hide-sm { display: none; } th, td { padding: 7px 6px; } td:nth-child(2) { white-space: normal; } }
</style>
</head>
<body>
<main>
  <nav class="tabs" role="tablist">
    <button role="tab" data-mode="nba">King of the Court</button>
    <button role="tab" data-mode="nfl">King of the End Zone</button>
  </nav>
  <h1 id="title"></h1>
  <div class="sub"><span id="blurb"></span> <span id="updated"></span></div>

  <div class="controls">
    <label>Date <input type="date" id="date"></label>
    <button id="today">Today</button>
    <label id="contenders-label"><input type="checkbox" id="contenders"> Hide non-contenders</label>
  </div>

  <div id="king"></div>
  <div class="games" id="games"></div>
  <div class="wrap"><div id="board" class="empty">Loading…</div></div>
  <div class="foot" id="foot"></div>
</main>

<script>
const ESPN = "https://site.api.espn.com/apis/site/v2/sports";
const $ = id => document.getElementById(id);
let timer = null, loadId = 0, paused = false, lastLoadAt = 0, refreshError = null;
let followToday = true; // roll over to the new day automatically unless a past date was picked
let last = null;        // most recent { date, games, players }, so toggles re-render without refetching
let mode = "nba";       // which promo tab is showing; a key of MODES
let shownDate = null;   // date go() last switched to (the date input already holds a picked date before go runs)
const excluded = new Set(); // NFL game ids the user dropped from the slate (reset when the date changes)
// Per-game box score cache: event id -> { players, sig, fetchedAt, endedAt, settled }.
// Live games are re-fetched only when their score or clock moves (sig), which skips timeouts,
// reviews and halftime. Finished games are re-fetched every few minutes for their first hour,
// since box scores can lag the "Final" status and stats get corrected after the buzzer; after
// that (or once the game started long enough ago, per sport) they're kept for good.
const cache = new Map();
const LIVE_POLL_MS = 30_000, FINAL_REFETCH_MS = 5 * 60_000, SETTLE_MS = 60 * 60_000;

// The NBA day is defined by US Eastern time.
function todayET() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
}

// #2026-10-26 is the NBA board for that date; #nfl and #nfl/2026-10-26 are the NFL board.
function readHash() {
  const m = location.hash.match(/\d{4}-\d{2}-\d{2}/);
  return { mode: location.hash.startsWith("#nfl") ? "nfl" : "nba", date: m ? m[0] : todayET() };
}

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}

function parsePlayers(summary) {
  const players = [];
  for (const team of summary?.boxscore?.players || []) {
    const st = team.statistics?.[0];
    if (!st) continue;
    const k = name => st.keys.indexOf(name);
    const [iP, iR, iA, iM] = [k("points"), k("rebounds"), k("assists"), k("minutes")];
    for (const a of st.athletes) {
      if (a.didNotPlay || !a.stats?.length) continue;
      const pts = +a.stats[iP] || 0, reb = +a.stats[iR] || 0, ast = +a.stats[iA] || 0;
      const pra = pts + reb + ast;
      if (pra < 1) continue;
      players.push({
        name: a.athlete.displayName, team: team.team.shortDisplayName, logo: team.team.logo,
        min: a.stats[iM], pts, reb, ast, pra,
      });
    }
  }
  return players;
}

// A Qualifying Bet can be any TD scorer, so every non-passing touchdown counts: for a passing TD
// the receiver is the scorer. Return and defensive TDs are flagged D/ST, since bets on the
// player and on that team's D/ST both win when one of those is the longest.
function parseTDs(summary) {
  const tds = [];
  for (const p of summary?.scoringPlays || []) {
    const kind = p.type?.text || "";
    if (p.type?.abbreviation !== "TD" && !/touchdown/i.test(kind)) continue;
    const text = (p.text || "").trim();
    // "Name 45 Yd pass from…", or with no yardage e.g. "Name Fumble Recovery in End Zone".
    const m = text.match(/^(.+?)\s+(?:(\d+)\s*Y(?:ar)?ds?\b|(?:fumble|interception|blocked|kickoff|punt|return|recovery)\b)/i);
    const per = p.period?.number;
    tds.push({
      name: m ? m[1] : text.split(" (")[0], yds: +(m?.[2] ?? 0), text,
      team: p.team?.abbreviation || "", logo: p.team?.logo || "",
      play: /^passing/i.test(kind) ? "Rec" : /^rushing/i.test(kind) ? "Rush" : kind.replace(/\s*touchdown$/i, ""),
      dst: !/^(passing|rushing)/i.test(kind) && !/\bown\b/i.test(kind), // "(Own)" = offense recovered its own fumble
      when: (per > 4 ? "OT" : "Q" + per) + " " + (p.clock?.displayValue || ""),
    });
  }
  return tds;
}

const teamCell = p => `<td><span class="team"><img src="${esc(p.logo)}" alt="${esc(p.team)}" title="${esc(p.team)}" loading="lazy"><span class="hide-sm">${esc(p.team)}</span></span></td>`;
const statusCell = p => `<td class="status ${p.state} hide-sm">${p.state === "in" ? '<span class="dot"></span>' : ""}${esc(p.detail)}</td>`;

const MODES = {
  nba: {
    api: `${ESPN}/basketball/nba`, title: "King of the Court 👑", doc: "KOTC Leaderboard",
    blurb: "Highest points + rebounds + assists in a single NBA day.",
    foot: `Data from ESPN. Refreshes every 30s while games are live. Players need at least 1 point, rebound or assist to be listed.
      "Non-contenders" are players whose game is over and who finished below the leader.`,
    parse: s => parsePlayers(s).map(p => ({ ...p, value: p.pra, tiebreak: p.pts })),
    sig: g => `${g.away.score}-${g.home.score}-${g.detail}`,
    longAgo: 4 * 60 * 60_000, emptyFinal: false,
    none: "No NBA games on this date.", pre: "No games have tipped off yet.",
    empty: "Box scores aren't available yet. Retrying shortly.",
    king: (names, top) => `<b>${names}</b> with <b>${top}</b> PRA`,
    head: `<th>#</th><th>Player</th><th>Team</th><th class="hide-sm">Min</th>
      <th>Pts</th><th>Reb</th><th>Ast</th><th>PRA</th><th class="hide-sm">Status</th>`,
    cells: (p, crown) => `<td>${esc(p.name)}${crown}</td>${teamCell(p)}
      <td class="hide-sm">${esc(p.min ?? "")}</td>
      <td>${p.pts}</td><td>${p.reb}</td><td>${p.ast}</td>
      <td class="pra">${p.pra}</td>${statusCell(p)}`,
  },
  nfl: {
    api: `${ESPN}/football/nfl`, title: "King of the End Zone 🏈", doc: "KOTEZ Leaderboard",
    blurb: "Longest touchdown on the NFL slate. Tap a game to take it off the slate.",
    foot: `Data from ESPN. Refreshes every 30s while games are live. Passing TDs count for the receiver, not the passer.
      Return and defensive TDs are tagged D/ST: bets on the player or that team's D/ST both win. Ties split the pool.`,
    parse: s => parseTDs(s).map(p => ({ ...p, value: p.yds, tiebreak: 0 })),
    // Scoring plays only change when the score does, so the running clock doesn't trigger a refetch.
    sig: g => `${g.away.score}-${g.home.score}`,
    // NFL games run 3-4 hours, and a finished game can legitimately have no touchdowns.
    longAgo: 5 * 60 * 60_000, emptyFinal: true,
    none: "No NFL games on this date.", pre: "No games have kicked off yet.",
    empty: "No touchdowns yet. If none are scored, No Touchdown Scorer bets split the pool.",
    king: (names, top) => `<b>${names}</b> with a <b>${top}</b>-yard TD`,
    head: `<th>#</th><th>Player</th><th>Team</th><th>Yds</th><th>Play</th>
      <th class="hide-sm">When</th><th class="hide-sm">Status</th>`,
    cells: (p, crown) => `<td title="${esc(p.text)}">${esc(p.name)}${p.dst ? '<span class="tag">D/ST</span>' : ""}${crown}</td>${teamCell(p)}
      <td class="pra">${p.yds}</td><td>${esc(p.play)}</td>
      <td class="hide-sm">${esc(p.when)}</td>${statusCell(p)}`,
  },
};

async function load(date) {
  clearTimeout(timer);
  const id = ++loadId;
  try {
    const sb = await getJSON(`${MODES[mode].api}/scoreboard?dates=${date.replaceAll("-", "")}`);
    const games = (sb.events || []).map(e => {
      const c = e.competitions[0];
      const t = Object.fromEntries(c.competitors.map(x => [x.homeAway, x]));
      return { id: e.id, state: e.status.type.state, completed: e.status.type.completed,
               detail: e.status.type.shortDetail, away: t.away, home: t.home,
               start: Date.parse(e.date), settled: false };
    });

    const now = Date.now();
    const lists = await Promise.all(games.map(g => excluded.has(g.id) ? [] : gamePlayers(g, now)));
    const players = lists.flat().sort((a, b) => b.value - a.value || b.tiebreak - a.tiebreak);
    if (id !== loadId) return; // a newer load started; drop this result

    last = { date, games, players };
    lastLoadAt = now;
    refreshError = null;
    render(date, games, players);

    // Poll fast while anything is live, every few minutes while finished games settle or games
    // are still to come today. When following today and everything is settled, check
    // occasionally so the page rolls over to the next day.
    const slate = games.filter(g => !excluded.has(g.id));
    const live = slate.some(g => g.state === "in");
    const pending = slate.some(g => g.state === "pre");
    const unsettled = slate.some(g => !g.settled && g.state === "post");
    if (live) schedule(LIVE_POLL_MS);
    else if (unsettled || (pending && date === todayET())) schedule(FINAL_REFETCH_MS);
    else if (followToday) schedule(10 * 60_000);
  } catch (err) {
    if (id === loadId) showError(err, date);
  }
}

// Returns a game's players, downloading its box score only when the cache entry is out of date.
// Sets g.settled once a finished game's stats are final enough to crown a king.
async function gamePlayers(g, now) {
  if (g.state === "pre") return [];
  if (g.state === "post" && !g.completed) { g.settled = true; return []; } // postponed or canceled

  const final = g.state === "post";
  const m = mode; // pinned, in case the tab switches while the box score is downloading
  const M = MODES[m], sig = M.sig(g);
  const key = m + ":" + g.id;
  let entry = cache.get(key);
  const upToDate = entry && (final
    ? entry.endedAt !== undefined && (entry.settled || now - entry.fetchedAt < FINAL_REFETCH_MS)
    : entry.sig === sig);

  if (!upToDate) {
    const summary = await getJSON(`${M.api}/summary?event=${g.id}`).catch(() => null);
    if (summary) {
      // endedAt is when this tab first got a box score for the game as final.
      const endedAt = final ? (entry?.endedAt ?? now) : undefined;
      entry = { players: M.parse(summary), sig, fetchedAt: now, endedAt, settled: false };
      cache.set(key, entry);
    }
  }

  // An empty box score never settles (unless the sport allows it), so a bad response gets
  // retried instead of kept for good.
  if (final && entry?.endedAt !== undefined && !entry.settled && (entry.players.length || M.emptyFinal) &&
      (now - entry.endedAt >= SETTLE_MS || now - g.start >= M.longAgo)) entry.settled = true;
  g.settled = !!(final && entry?.settled);
  g.missing = !entry; // no box score yet, so an empty list here means "unknown", not "nothing happened"

  // Status comes from the scoreboard, so it stays current even if the box score fetch failed.
  return (entry?.players || []).map(p => ({ ...p, gameId: g.id, state: g.state, detail: g.detail }));
}

// Timers don't fetch while the tab is hidden; the visibilitychange handler catches up instead.
function schedule(ms) {
  timer = setTimeout(() => { if (document.hidden) paused = true; else tick(); }, ms);
}

function tick() {
  const date = $("date").value;
  // Hold the rollover until the previous night's games are over and their stats have settled.
  const busy = last?.date === date && last.games.filter(g => !excluded.has(g.id)).some(g => g.state === "in" || (g.state === "post" && !g.settled));
  if (followToday && date !== todayET() && !busy) go(todayET());
  else load(date);
}

function showError(err, date) {
  if (date !== $("date").value) return;
  if (last?.date === date) {
    // Keep the last good leaderboard on screen and flag it as stale.
    refreshError = err.message;
    render(last.date, last.games, last.players);
  } else {
    $("board").className = "empty";
    $("board").textContent = "Couldn't load data: " + err.message;
  }
  schedule(60_000);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function render(date, games, players) {
  const M = MODES[mode];
  $("updated").textContent = "Last update: " + new Date(lastLoadAt).toLocaleTimeString() +
    (refreshError ? ` (couldn't refresh: ${refreshError}; retrying)` : "");

  // NFL promos run on a slate of games, so each game card toggles whether it's on the slate.
  const tag = mode === "nfl" ? "button" : "div";
  $("games").innerHTML = games.map(g => `
    <${tag} class="game ${g.state}${excluded.has(g.id) ? " out" : ""}" data-id="${esc(g.id)}"${tag === "button" ? ` title="${excluded.has(g.id) ? "Add to" : "Remove from"} slate"` : ""}>
      <div class="row"><span>${esc(g.away.team.abbreviation)}</span><span>${g.state === "pre" ? "" : esc(g.away.score)}</span></div>
      <div class="row"><span>${esc(g.home.team.abbreviation)}</span><span>${g.state === "pre" ? "" : esc(g.home.score)}</span></div>
      <div class="st">${g.state === "in" ? '<span class="dot"></span>' : ""}${esc(g.detail)}</div>
    </${tag}>`).join("");

  const slate = games.filter(g => !excluded.has(g.id));
  if (!slate.length) {
    $("king").innerHTML = "";
    $("board").className = "empty";
    $("board").textContent = games.length ? "Every game is off the slate. Tap one to add it back." : M.none;
    return;
  }
  if (!players.length) {
    $("king").innerHTML = "";
    $("board").className = "empty";
    $("board").textContent = slate.some(g => g.missing) ? "Box scores aren't available yet. Retrying shortly."
      : slate.some(g => g.state !== "pre") ? M.empty : M.pre;
    return;
  }

  const top = players[0].value;
  const kings = [...new Set(players.filter(p => p.value === top).map(p => p.name))];
  // Only crown a king once every game is final and its stats have had time to settle.
  const allFinal = slate.every(g => g.state === "post" && g.settled);
  $("king").innerHTML = `<div class="king">${allFinal ? "The king is" : "Current leader:"}
    ${M.king(kings.map(esc).join(" & "), top)}</div>`;

  const hide = mode === "nba" && $("contenders").checked;
  const shown = hide ? players.filter(p => p.state !== "post" || p.value === top) : players;

  let rank = 0, prev = null;
  $("board").className = "";
  $("board").innerHTML = `<table>
    <thead><tr>${M.head}</tr></thead>
    <tbody>${shown.map((p, i) => {
      if (p.value !== prev) { rank = i + 1; prev = p.value; }
      const crown = p.value === top ? " 👑" : "";
      return `<tr class="${p.value === top ? "top" : ""}">
        <td class="rank">${rank}</td>${M.cells(p, crown)}
      </tr>`;
    }).join("")}</tbody></table>`;
}

function go(date, newMode = mode) {
  clearTimeout(timer);
  if (newMode !== mode || date !== shownDate) { excluded.clear(); last = null; }
  mode = newMode;
  shownDate = date;
  const M = MODES[mode];
  document.title = M.doc;
  $("title").textContent = M.title;
  $("blurb").textContent = M.blurb;
  $("foot").textContent = M.foot;
  $("contenders-label").hidden = mode !== "nba";
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.mode === mode);
  $("games").innerHTML = "";
  $("king").innerHTML = "";

  followToday = date === todayET();
  $("date").value = date;
  const prefix = mode === "nfl" ? "#nfl" : "";
  history.replaceState(null, "", (followToday ? prefix : (prefix ? prefix + "/" : "#") + date) || location.pathname);
  $("board").className = "empty";
  $("board").textContent = "Loading…";
  load(date);
}

$("date").addEventListener("change", e => e.target.value && go(e.target.value));
for (const b of document.querySelectorAll(".tabs button"))
  b.addEventListener("click", () => b.dataset.mode !== mode && go(todayET(), b.dataset.mode));
$("games").addEventListener("click", e => {
  const card = e.target.closest("button.game");
  if (!card) return;
  const id = card.dataset.id;
  if (excluded.delete(id)) return load($("date").value); // adding a game back needs its scoring plays
  excluded.add(id);
  if (!last) return load($("date").value);
  last.players = last.players.filter(p => p.gameId !== id);
  render(last.date, last.games, last.players);
});
$("today").addEventListener("click", () => go(todayET()));
$("contenders").addEventListener("change", () => last && render(last.date, last.games, last.players));
window.addEventListener("hashchange", () => { const h = readHash(); go(h.date, h.mode); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  // Catch up after a skipped poll, or after the phone froze timers while we were following today.
  if (paused || (followToday && Date.now() - lastLoadAt >= LIVE_POLL_MS)) {
    paused = false;
    clearTimeout(timer);
    tick();
  }
});
{ const h = readHash(); go(h.date, h.mode); }
</script>
</body>
</html>
